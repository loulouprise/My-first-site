<main id="game">
<aside aria-label="Sacs de tri">
<div id="bagRows"></div>
<button class="reset" id="reset" title="Recommencer">RAZ ↻</button>
</aside>
<section id="world" class="world forest" aria-label="Zone de recherche des escargots">
<div class="top-ui"><span class="progress" id="progress">0 / 0 trouvés</span><button class="pill" id="switch">Autre milieu ↗</button></div>
<div class="mobile-hint">Glissez les escargots vers les sacs</div>
<div id="message" class="message" role="status"></div>
</section>
<div class="overlay" id="overlay"><div class="intro"><div class="intro-text">Récupérez les <i>Cepaea nemoralis</i><br>et placez-les dans le sac correspondant à leur coquille.</div><button class="start" id="start">Commencer</button></div></div>
</main>
<script>
const colors={orange:{shell:'#dc8d53',dark:'#854325',light:'#ffd2a1'},yellow:{shell:'#ffeb05',dark:'#968d00',light:'#fff89b'},red:{shell:'#ed4718',dark:'#862c14',light:'#ff9962'}};
const scenePositions={forest:[[9,39,'red'],[25,64,'red'],[38,31,'red'],[58,40,'red'],[86,31,'red'],[76,66,'orange'],[20,74,'orange'],[46,70,'orange'],[71,84,'yellow'],[92,83,'yellow'],[8,90,'red'],[52,14,'orange']],path:[[14,77,'orange'],[35,57,'yellow'],[55,55,'orange'],[68,28,'yellow'],[79,69,'yellow'],[90,58,'yellow'],[50,78,'red'],[27,90,'yellow'],[72,85,'orange'],[91,30,'red'],[38,39,'orange'],[11,43,'red']]};
let scene='forest', completed={forest:new Set(),path:new Set()}, started=false,drag=null,toastTimeout;
const world=document.getElementById('world'), bags=document.getElementById('bagRows'),overlay=document.getElementById('overlay');
function snailSVG(c){let s=colors[c];return `<svg viewBox="0 0 115 82" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M27 53 Q49 54 60 49 Q74 41 87 55 L102 55 108 47 109 37 M102 55 Q107 67 96 69 L43 69 Q30 68 23 61 M86 55 L89 43 87 34" fill="#666a58" stroke="#252c24" stroke-width="3" stroke-linecap="round"/><path d="M107 37 l-5 -6 m-13 3 -5 -7" stroke="#242a23" stroke-width="3" stroke-linecap="round"/><ellipse cx="45" cy="42" rx="38" ry="35" fill="${s.shell}" stroke="#3b251c" stroke-width="3"/><path d="M12 54 Q15 16 43 14 Q72 14 73 42 Q72 64 44 64 Q22 60 25 39 Q28 22 47 25 Q60 29 56 44 Q51 55 41 49 Q32 41 40 35 Q46 32 49 39" fill="none" stroke="${s.dark}" stroke-width="5" stroke-linecap="round"/><path d="M19 50 Q23 13 47 15" fill="none" stroke="${s.light}" stroke-width="4" opacity=".7"/><path d="M29 70 Q37 73 46 70" stroke="#252c24" stroke-width="2" fill="none"/></svg>`}
function bagSVG(){return `<svg viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17 10 Q30 25 47 14 Q59 31 78 20 Q95 9 111 21 Q128 13 145 7 L142 44 Q132 67 142 109 Q147 154 111 160 Q66 173 29 157 Q9 144 18 104 Q30 71 19 43 Z" fill="#979b0b" stroke="#ecebb4" stroke-width="2"/><path d="M19 10 Q40 40 25 84 Q10 139 40 157 M74 20 Q86 47 79 82 Q69 132 87 164 M122 16 Q105 42 116 75 Q127 120 114 160" fill="none" stroke="#efedbf" opacity=".62" stroke-width="2"/><path d="M17 44 Q65 55 143 41" stroke="#4d4c22" stroke-dasharray="4 5" stroke-width="2" fill="none"/></svg>`}
function setupBags(){bags.innerHTML='';for(const c of ['orange','yellow','red']){let row=document.createElement('div');row.className='bag-row';row.innerHTML=`<div class="bag-label"><div class="snail-mini">${snailSVG(c)}</div><span class="count" id="count-${c}">0</span></div><div class="bag" data-color="${c}" role="group" aria-label="Sac ${c}">${bagSVG()}</div>`;bags.appendChild(row)}}
function getSceneSnails(){return scenePositions[scene]};
function render(){world.className='world '+scene;world.querySelectorAll('.snail').forEach(x=>x.remove());getSceneSnails().forEach(([x,y,c],id)=>{if(completed[scene].has(id))return;let el=document.createElement('div');el.className='snail';el.dataset.id=id;el.dataset.color=c;el.setAttribute('role','img');el.setAttribute('aria-label','Escargot '+({red:'rouge',yellow:'jaune',orange:'orange'}[c]));el.style.left=`calc(${x}% - 25px)`;el.style.top=`calc(${y}% - 20px)`;el.innerHTML=snailSVG(c);el.addEventListener('pointerdown',startDrag);world.appendChild(el)});for(const c of Object.keys(colors)){document.getElementById('count-'+c).textContent=[...completed[scene]].filter(i=>scenePositions[scene][i][2]===c).length}let total=completed.forest.size+completed.path.size;document.getElementById('progress').textContent=`${completed[scene].size} / ${scenePositions[scene].length} trouvés`;document.getElementById('switch').textContent=scene==='forest'?'Aller au chemin ↗':'Aller en forêt ↗';if(total===24)showWin()}
function startDrag(ev){if(!started||drag)return;ev.preventDefault();const el=ev.currentTarget;const rect=el.getBoundingClientRect();drag={el,id:Number(el.dataset.id),color:el.dataset.color,offsetX:ev.clientX-rect.left,offsetY:ev.clientY-rect.top,originalLeft:el.style.left,originalTop:el.style.top};el.classList.add('dragging');el.setPointerCapture(ev.pointerId);moveDrag(ev);el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag,{once:true});el.addEventListener('pointercancel',endDrag,{once:true})}
function moveDrag(ev){if(!drag)return;let r=world.getBoundingClientRect();drag.el.style.left=(ev.clientX-r.left-drag.offsetX)+'px';drag.el.style.top=(ev.clientY-r.top-drag.offsetY)+'px';document.querySelectorAll('.bag').forEach(b=>{let rect=b.getBoundingClientRect();b.classList.toggle('over',ev.clientX>=rect.left&&ev.clientX<=rect.right&&ev.clientY>=rect.top&&ev.clientY<=rect.bottom)})}
function endDrag(ev){if(!drag)return;let d=drag;d.el.removeEventListener('pointermove',moveDrag);d.el.classList.remove('dragging');let target=[...document.querySelectorAll('.bag')].find(b=>{let r=b.getBoundingClientRect();return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom});document.querySelectorAll('.bag').forEach(b=>b.classList.remove('over'));if(target&&target.dataset.color===d.color){completed[scene].add(d.id);target.classList.add('correct');setTimeout(()=>target.classList.remove('correct'),420);render();showMessage('Bien joué ! Escargot correctement rangé.')}else{d.el.style.left=d.originalLeft;d.el.style.top=d.originalTop;if(target)showMessage('Ce n’est pas le bon sac. Réessaie !');}drag=null}
function showMessage(t){let x=document.getElementById('message');x.textContent=t;x.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>x.classList.remove('visible'),1600)}
function showWin(){overlay.innerHTML=`<div class="win"><h2>Bravo ! 🐌</h2><p>Tu as retrouvé et trié les 24 escargots dans les deux milieux !</p><button class="pill" id="again">Rejouer</button></div>`;overlay.style.display='grid';document.getElementById('again').onclick=reset}
function reset(){completed={forest:new Set(),path:new Set()};scene='forest';overlay.style.display='none';started=true;render();showMessage('Nouvelle partie !')}
setupBags();render();document.getElementById('start').onclick=()=>{started=true;overlay.style.display='none'};document.getElementById('reset').onclick=reset;document.getElementById('switch').onclick=()=>{scene=scene==='forest'?'path':'forest';render();showMessage(scene==='forest'?'Milieu : forêt':'Milieu : chemin')};
</script></body></html>
